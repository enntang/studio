  <div class="info">
    每次眨眼 <code>0.2s</code>（開→半→閉→半→開）。<br />
    節奏：快速眨兩下（間隔 <code>0.1s</code>）→ 短間隔 <code>0.35s</code> → 再眨一次 → 長間隔 <code>1.5s</code> → 重複。
  </div>
  <button id="restartBtn">重新播放</button>

<script>
  const frames = {
    open: document.getElementById('frame-open'),
    half: document.getElementById('frame-half'),
    closed: document.getElementById('frame-closed'),
  };

  // one blink = half -> closed -> half, spread evenly across 0.2s
  const BLINK_STEP = 50; // ms

  const QUICK_GAP = 100;  // between the two rapid blinks
  const SHORT_GAP = 350;  // before the third, single blink
  const LONG_GAP = 1500;  // rest before the loop repeats

  function blinkMotion() {
    return [
      { frame: 'half', duration: BLINK_STEP },
      { frame: 'closed', duration: BLINK_STEP * 2 },
      { frame: 'half', duration: BLINK_STEP },
    ];
  }

  const sequence = [
    { frame: 'open', duration: LONG_GAP },
    ...blinkMotion(),   // blink 1

    { frame: 'open', duration: QUICK_GAP },
    ...blinkMotion(),   // blink 2 (rapid double-blink with blink 1)

    { frame: 'open', duration: SHORT_GAP },
    ...blinkMotion(),   // blink 3 (single, after short gap)
  ];

  let timeoutId = null;

  function showFrame(name) {
    for (const key in frames) {
      frames[key].classList.toggle('active', key === name);
    }
  }

  function playFrom(index) {
    const step = sequence[index % sequence.length];
    showFrame(step.frame);
    timeoutId = setTimeout(() => playFrom(index + 1), step.duration);
  }

  function restart() {
    clearTimeout(timeoutId);
    playFrom(0);
  }

  document.getElementById('restartBtn').addEventListener('click', restart);
  restart();
</script>
